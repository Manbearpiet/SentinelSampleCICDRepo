name: Deploy Content to Sentinel Workspace

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "AnalyticsRule/**"
      - "AutomationRule/**"
      - "HuntingQuery/**"
      - "Parser/**"
      - "Playbook/**"
      - "Workbook/**"
      - "!.github/workflows/**"
      - ".github/workflows/sentinel-deploy.yml"

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    env:
      resourceGroupName: ${{ vars.RESOURCEGROUPNAME }}
      workspaceName: ${{ vars.workspaceName }}
      workspaceId: ${{ vars.workspaceId }}
      subscriptionId: ${{ vars.SUBSCRIPTIONID }}
      directory: "${{ github.workspace }}"
      cloudEnv: "AzureCloud"
      creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS }}
      contentTypes: "AnalyticsRule,AutomationRule,HuntingQuery,Parser,Playbook,Workbook"
      branch: "main"
      sourceControlId: "source-control-id"
      rootDirectory: "${{ github.workspace }}"
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: "true"

    steps:
      - name: Login to Azure (Attempt 1)
        continue-on-error: true
        id: login1
        uses: azure/login@v1
        if: ${{ env.cloudEnv == 'AzureCloud' }}
        with:
          creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Wait 30 seconds if login attempt 1 failed
        if: ${{ env.cloudEnv == 'AzureCloud' && steps.login1.outcome=='failure' }}
        run: powershell Start-Sleep -s 30

      - name: Login to Azure (Attempt 2)
        continue-on-error: true
        id: login2
        uses: azure/login@v1
        if: ${{ env.cloudEnv == 'AzureCloud' && steps.login1.outcome=='failure' }}
        with:
          creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Wait 30 seconds if login attempt 2 failed
        if: ${{ env.cloudEnv == 'AzureCloud' && steps.login2.outcome=='failure' }}
        run: powershell Start-Sleep -s 30

      - name: Login to Azure (Attempt 3)
        continue-on-error: false
        id: login3
        uses: azure/login@v1
        if: ${{ env.cloudEnv == 'AzureCloud' && steps.login2.outcome=='failure'  }}
        with:
          creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Checkout
        uses: actions/checkout@v1

      - name: Deploy Content to Azure Sentinel
        uses: azure/powershell@v1
        with:
          azPSVersion: "latest"
          inlineScript: |
            pwsh psrule/azure-sentinel-deploy.ps1
